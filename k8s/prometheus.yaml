apiVersion: v1
kind: ConfigMap
metadata:
  name: gpu-queue-prometheus
  namespace: inference
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
    scrape_configs:
      - job_name: gpu-token-queue
        static_configs:
          - targets: ["token-queue:8080"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-queue-prometheus
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-queue-prometheus
  template:
    metadata:
      labels:
        app: gpu-queue-prometheus
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args: ["--config.file=/etc/autoscaler/prometheus.yml", "--storage.tsdb.path=/prometheus",
                 "--storage.tsdb.retention.time=24h"]
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/autoscaler
              readOnly: true
            - name: storage
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: gpu-queue-prometheus
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-queue-prometheus
  namespace: inference
spec:
  selector:
    app: gpu-queue-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
